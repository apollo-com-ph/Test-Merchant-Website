name: deploy-test-merchant-website

on:
  push:
    # switch to main branch trigger as requested
    branches:
      - main
    paths-ignore:
      - 'k8s/manifests/**'
      - 'k8s/apps/**'  # manifest changes do not rebuild image

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AM1_DOCKER_REGISTRY }}
          username: ${{ secrets.AM1_DOCKER_USER }}
          password: ${{ secrets.AM1_DOCKER_PASS }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.AM1_DOCKER_REGISTRY }}/payconnect-switch/test-merchant-website:1.0.0-test
          cache-from: type=local,src=/opt/test-merchant-website/.buildx-cache
          cache-to: type=local,dest=/opt/test-merchant-website/.buildx-cache-new, mode=max  
          
      - name: Move cache
        run: |
          rm -rf /opt/test-merchant-website/.buildx-cache
          mv /opt/test-merchant-website/.buildx-cache-new /opt/test-merchant-website/.buildx-cache

